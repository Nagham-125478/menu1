<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام</title>
    <link rel="stylesheet" href="style.css">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>قائمة الطعام</h1>
        <div class="cart-icon-wrapper" onclick="toggleCart()">
            <i class="fas fa-shopping-basket"></i>
            <span id="cartCount" class="cart-count">0</span>
        </div>
    </header>

    <!-- شريط البحث والتصنيفات -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="ابحث عن وجبة..." onkeyup="filterItems()">
        <div class="categories-bar">
            <button class="cat-btn active" onclick="filterCategory('all')">الكل</button>
            <button class="cat-btn" onclick="filterCategory('grill')">المشويات</button>
            <button class="cat-btn" onclick="filterCategory('mandi')">المندي والمدفون</button>
            <button class="cat-btn" onclick="filterCategory('rice')">الأرز والدجاج</button>
            <button class="cat-btn" onclick="filterCategory('pastry')">المعجنات</button>
            <button class="cat-btn" onclick="filterCategory('appetizers')">المقبلات</button>
            <button class="cat-btn" onclick="filterCategory('stew')">الطبيخ</button>
            <button class="cat-btn" onclick="filterCategory('sandwiches')">الشاورما والسندويشات</button>
            <button class="cat-btn" onclick="filterCategory('fried')">البروستد والبرغر</button>
            <button class="cat-btn" onclick="filterCategory('drinks')">المشروبات</button>
            <button class="cat-btn" onclick="filterCategory('desserts')">الحلويات</button>
        </div>
    </div>

    <!-- قائمة الطعام -->
    <main id="menuContainer" class="menu-container"></main>

    <!-- شريط السلة الثابت بالأسفل -->
    <div class="cart-bar" onclick="toggleCart()">
        <div class="cart-info">
            <span>محتويات السلة (<strong id="bottomCartCount">0</strong>)</span>
            <span>الإجمالي: <strong id="bottomCartTotal">0.00</strong> د.أ</span>
        </div>
        <button class="view-cart-btn">عرض السلة <i class="fas fa-chevron-up"></i></button>
    </div>

    <!-- النافذة المنبثقة لعرض مكونات السلة -->
    <div id="cartModal" class="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h2><i class="fas fa-shopping-cart"></i> سلة الطلبات</h2>
                <span class="close-btn" onclick="toggleCart()">&times;</span>
            </div>
            
            <div id="cartItems" class="cart-items">
                <!-- سيتم إضافة مكونات السلة هنا تلقائياً -->
            </div>

            <div class="cart-footer">
                <div class="total-price">
                    <span>المجموع الكلي:</span>
                    <span id="modalCartTotal">0.00</span> د.أ
                </div>
                <div class="modal-actions">
                    <button class="clear-btn" onclick="clearCart()">تفريغ السلة</button>
                    <button class="close-modal-btn" onclick="toggleCart()">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
